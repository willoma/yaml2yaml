!define majority: 18
!define year: 2026
!define man:
  !define is: ugly
  !define has: smell

!define looks:
  !if _ == "f":
    !define is: strong
    !define has: boobies
  !if _ == "m": !apply man
  beautiful: ?_ == "f"
  appearance: ?is + " with " + has

!define adult:
  born in: ?year - age
  adult for: ?age - majority + " years"

alice:
  !apply looks: f
  job: CEO
  !apply adult:
    age: 34
bob:
  !apply looks: m
  !apply adult:
    age: 28
  job: assistant

!define colors:
  - base: red
    variant: light
  - base: blue
    variant: dark
  - base: green
    variant: medium

!for colors:
  ?_.variant + _.base:
    rank: ?i
    base_color: ?_.base

colorslist:
  !for colors:
    - name: ?_.variant + _.base
      base_color: ?_.base
