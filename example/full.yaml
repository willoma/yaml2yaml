!include full.include.yaml:

!define looks:
  !if _ == "f":
    !define is: strong
    !define has: boobies
  !if _ == "m": !apply man
  beautiful: !expr _ == "f"
  appearance: !expr is + " with " + has

!define adult:
  born in: !expr year - age
  adult for: !expr age - majority + " years"
  !if wonderful:
    person: wonderful
  !if wonderful == false:
    person: mediocre

alice:
  !apply looks: f
  job: CEO
  !apply adult:
    age: 34
    wonderful: true
bob:
  !apply looks: m
  !apply adult:
    age: 28
    wonderful: false
  job: assistant

!define colors:
  - base: red
    variant: light
  - base: blue
    variant: dark
  - base: green
    variant: medium
  - base: yellow
    variant: pastel
  - base: grey
    variant: light

!for colors:
  !expr variant + base:
    rank: !expr i
    base_color: !expr base

colorslist:
  !for colors:
    - name: !expr variant + base
      base_color: !expr base

colorsslice: !expr colors[1:3]

fourthcolor: !expr colors[3].base

!if colors:
  has_colors: true
