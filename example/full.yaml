!include full.include.yaml:

!define looks:
  !if _ == "f":
    !define is: strong
    !define has: boobies
  !if _ == "m": !apply man
  beautiful: ?_ == "f"
  appearance: ?is + " with " + has

!define adult:
  born in: ?year - age
  adult for: ?age - majority + " years"
  !if wonderful:
    person: wonderful
  !if wonderful == false:
    person: mediocre

alice:
  !apply looks: f
  job: CEO
  !apply adult:
    age: 34
    wonderful: true
bob:
  !apply looks: m
  !apply adult:
    age: 28
    wonderful: false
  job: assistant

!define colors:
  - base: red
    variant: light
  - base: blue
    variant: dark
  - base: green
    variant: medium
  - base: yellow
    variant: pastel
  - base: grey
    variant: light

!for colors:
  ?variant + base:
    rank: ?i
    base_color: ?base

colorslist:
  !for colors:
    - name: ?variant + base
      base_color: ?base

colorsslice: ?colors[1:3]

fourthcolor: ?colors[3].base

!if colors:
  has_colors: true
